<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
</head>
<body>
    <h1>Your Cart</h1>

    {% if items %}
        <ul>
            {% for item in items %}
                <li>
                    {{ item.product.name }} - {{ item.quantity }} x {{ item.product.price }}
                    <a href="{% url 'remove_from_cart' item.product.id %}">Remove</a>
                </li>
            {% endfor %}
        </ul>

        <p>Total: {{ total }}</p>
        <a href="{% url 'category_list' %}">Continue Shopping</a>
    {% else %}
        <p>Your cart is empty.</p>
        <a href="{% url 'category_list' %}">Go Shopping</a>
    {% endif %}
</body>
</html>
