{% extends "base.html" %}

{% block content %}
  <h2>Welcome, {{ user.username }}</h2>
  <p>Email: {{ user.email }}</p>
  <p>Phone: {{ user.profile.phone }}</p>
  <p>Address: {{ user.profile.address }}</p>

  <p></p><a href="{% url 'edit_profile' %}">Edit Profile</a></p>
  <a href="{% url 'home' %}" style="text-decoration: none; padding: 8px 16px; background-color: #4CAF50; color: white; border-radius: 5px;">Back to Home</a>

{% endblock %}
